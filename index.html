.ticket{border:2px dashed #9c463c;border-radius:16px;background:#fff6e5;padding:18px clamp(16px,4vw,32px);margin:16px 0 24px}.ticket small{color:#863930}.ticket h2{color:#214e40}.word{font-size:30px;letter-spacing:.18em;background:white;padding:3px 12px;color:#a43930;user-select:all}.ticket p{margin:10px 0}.ticket button{margin-top:6px}.award{display:flex;justify-content:space-between;border-bottom:1px solid #cbc5b7;padding:8px 0}.ticket fieldset{border:0;padding:0}.ticket label{display:block;margin:12px 0}.ticket input:not([type=checkbox]),.ticket select{display:block;width:100%;padding:10px;font:inherit;border:1px solid #848578;border-radius:6px;background:white}.coupon{margin:18px 0;padding:clamp(16px,3vw,30px);background:#f4ead5;border:2px dashed #99684a;border-radius:14px}.coupon-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.coupon article{background:#fffaf0;border-radius:8px;padding:14px}.coupon strong{display:block;color:#a4372e;font-size:26px}.coupon button{margin-top:8px}dialog img.coupon-image{display:block;float:none;width:100%}dialog a.btn{display:inline-block;margin-right:8px}#coupon-form label{display:block;margin:10px 0}#coupon-form input:not([type=checkbox]){display:block;font:inherit;width:100%;padding:8px;border:1px solid #878f82;border-radius:5px}#coupon-form .cons{font-size:14px}</style></head><body><header><strong>新航道-前程留学</strong><small>双旦限定 / 2026—27</small></header><main id="app"></main><footer>申请季怪同学　·　娱乐性自我观察，适合用来聊学习偏好和申请准备。</footer><dialog id="popup"></dialog><script>
const raw=[["当你经历一段忙碌的社交或协作后，通常怎样恢复状态？", "独处一会儿，整理自己的想法", "找熟悉的人聊聊，重新获得能量", "两种方式都可以，视当天状态而定", "S", "core"], ["面对一个重要决定，你更习惯先怎么做？", "先自己思考，形成初步判断", "找人讨论，在交流中厘清想法", "独立思考和讨论都会进行", "S", "core"], ["遇到陌生环境时，你通常会？", "先观察环境，按自己的节奏适应", "主动认识周围的人，建立连接", "看环境和任务需要", "S", "core"], ["完成一项任务后，你更愿意？", "独自复盘，总结自己的经验", "和相关的人交流感受与收获", "两种方式都喜欢", "S", "core"], ["周末有一段完全自由的时间，你更可能？", "安排一段独处时间做喜欢的事", "约朋友见面或参加集体活动", "看当时心情决定", "S", "core"], ["当你感到压力时，第一反应通常是？", "暂时退回自己的空间，理清问题", "找信任的人说出来，获得支持", "可能独处，也可能找人交流", "S", "core"], ["在团队中，你更自然的状态是？", "先独立完成自己的部分，再同步结果", "边交流边推进，保持互动", "根据团队任务灵活切换", "S", "core"], ["你更容易在哪种状态下感到充实？", "拥有自主空间，按自己的节奏投入", "与人产生连接，一起完成事情", "两种状态都能带来满足", "S", "core"], ["理解一个复杂问题时，你更先关注？", "背后的规律、联系和可能性", "具体事实、数据和可验证细节", "两方面都会关注", "T", "core"], ["听到一个新观点，你通常会先？", "思考它可能意味着什么、还能延伸到哪里", "确认依据是什么、是否有实际证据", "先理解观点，再判断", "T", "core"], ["回忆一次经历时，你更容易记住？", "整体氛围、核心意义和联想", "具体过程、细节和发生顺序", "两者都比较清楚", "T", "core"], ["面对信息不完整的情况，你通常？", "先根据线索形成整体判断", "先补充事实，避免过早下结论", "会结合直觉与证据", "T", "core"], ["学习新知识时，你更喜欢？", "先理解框架、原理和知识之间的联系", "先掌握定义、步骤和具体案例", "两种学习方式结合", "T", "core"], ["讨论一个问题时，你更常提出？", "有没有另一种解释或更深层的联系", "有哪些事实、案例或数据可以支持", "根据讨论内容决定", "T", "core"], ["看到一件新事物，你首先容易注意到？", "它可能带来的新概念和延伸方向", "它的构成、功能和实际用途", "两方面都会注意", "T", "core"], ["当两种解释都说得通时，你更倾向？", "选择更能解释整体规律的观点", "选择证据更充分、可检验的观点", "继续收集信息再决定", "T", "core"], ["面对一个没有标准答案的新任务，你更愿意？", "先尝试几种方法，从实践中寻找方向", "先搭建计划和步骤，再按计划推进", "视任务风险和时间而定", "A", "core"], ["计划之外出现新机会时，你通常？", "愿意调整安排，探索新的可能", "先评估对原计划的影响，再决定是否调整", "根据机会价值决定", "A", "core"], ["开始一个项目时，你更自然的做法是？", "先做一个小尝试，边做边优化", "先明确目标、流程和完成标准", "两种方式交替使用", "A", "core"], ["你更喜欢哪种工作节奏？", "有变化、有尝试空间，可以不断探索", "有清晰结构，能够持续积累和推进", "稳定中有适度变化最好", "A", "core"], ["遇到不熟悉的事情，你通常？", "先动手体验，快速获得反馈", "先了解规则和方法，再开始行动", "根据难度选择", "A", "core"], ["当原定方案效果一般时，你更倾向？", "尝试新的路径，允许过程发生变化", "找出问题所在，逐步优化原有方案", "结合情况决定", "A", "core"], ["面对长期目标，你更喜欢？", "保留弹性，随着新发现调整路线", "拆成阶段任务，按节奏持续完成", "有主线，也保留调整空间", "A", "core"], ["一项任务有多种完成方式时，你更愿意？", "尝试不同方案，寻找新可能", "选择可靠方法，确保稳定完成", "比较之后再选择", "A", "core"], ["当你有强烈 const roles={"DIBF": {"desc": "你有很强的主见，习惯先在脑中搭出全局地图，再决定资源和行动顺序。遇到重要选择，你希望握有主动权；你不一定爱热闹，但很在意事情是否按目标推进。", "studyEnv": "自主度较高、目标清晰、能承担项目责任的学习环境；可关注课程选择权、实践项目和学生组织资源。", "studyFocus": "先看培养方案与毕业要求，再拆成学期目标；把语言、课程、科研或实习与申请材料纳入一张时间表。", "studyPlan": "申请材料突出目标设定、资源协调和项目推进；同时补充团队合作与接受反馈的例子，避免只呈现强势主导。", "tag": "全局拆解 · 直接拍板"}, "GIEH": {"desc": "你很看重体验、审美与个人风格。选择学校或城市时，除了排名和专业，也会留意环境氛围、文化资源与生活方式。你希望找到一条既有发展空间、又能表达自我的路线。", "studyEnv": "国际化、多元文化、创意表达空间丰富的环境；可关注城市文化、课程体验、跨学科选修和校园氛围。", "studyFocus": "通过课程大纲、学生作品、校园开放日和在读体验了解真实学习内容，不只看宣传图和学校名气。", "studyPlan": "把个人兴趣转化为可展示的经历或作品；申请时用具体项目说明审美与体验如何形成学习动机。", "tag": "气氛感知 · 体验联想"}, "DQBF": {"desc": "你做选择时会自然考虑成本、回报和未来落点。比起只听宏大叙事，你更想知道学什么、花多少、能获得什么资源，以及毕业后有哪些实际路径。", "studyEnv": "课程实用、实习资源清晰、就业支持完善的学习环境；比较学费与生活成本、行业联系、实习安排和职业服务。", "studyFocus": "先核对课程结构、实习机会、毕业去向和当地就业规则，再结合自己的兴趣与能力判断投入是否值得。", "studyPlan": "申请时用数据和具体经历说明选择逻辑；不要只追逐短期热门专业，也要关注课程是否能培养长期可迁移能力。", "tag": "结果导向 · 证据优先"}, "DIEH": {"desc": "你对新事物有天然好奇，喜欢亲自探索，不太愿意被单一路径定义。遇到未知时，你更想先去看看、试试看，再决定要不要深入。", "studyEnv": "课程灵活、跨学科资源丰富、允许自主选题和实践探索的环境；可关注交换项目、选修空间和创新实践。", "studyFocus": "用小项目、课程体验或短期实践验证兴趣，再逐渐收敛到一两个值得深入的主题。", "studyPlan": "申请时展示探索过程与反思，而不只是罗列兴趣；说明你如何从尝试中形成更清晰的学术方向。", "tag": "独自探路 · 跨界好奇"}, "GQBF": {"desc": "你喜欢有挑战、有反馈、有明确目标的事情。看到一个值得争取的机会，你往往愿意投入精力去冲一把，也希望自己的努力能转化为看得见的成果。", "studyEnv": "学术氛围积极、挑战资源丰富、目标路径相对清晰的环境；可关注研究机会、竞赛、荣誉项目和实习渠道。", "studyFocus": "为每个阶段设定可衡量的学习目标，同时保留复盘时间，避免只追逐结果而忽略基础能力。", "studyPlan": "申请材料突出持续投入、阶段成果和面对挑战的过程；用真实证据支撑目标感，不必把每段经历都包装成奖项。", "tag": "组队冲刺 · 进度驱动"}, "GQEH": {"desc": "你对周围环境和同伴节奏比较敏感。遇到靠谱队友，你很容易进入状态；如果身边人松散、拖延，你也可能不知不觉被带偏。选对环境，对你尤其重要。", "studyEnv": "学习共同体成熟、同伴支持充分、导师反馈及时的环境；可关注学习小组、学长学姐支持、辅导体系和校园社群。", "studyFocus": "主动寻找目标相近的学习伙伴，但同时建立自己的周计划、作业清单和阶段检查点。", "studyPlan": "选校时了解真实的课堂互动、学生支持和社群氛围；入学后尽早加入积极的学习圈，同时保留独立完成任务的能力。", "tag": "观察氛围 · 寻找同频"}, "DQBH": {"desc": "你不太追求一时的风头，更相信准备、纪律和持续投入。面对重要选择，你会先确认规则与风险，再按自己的节奏稳步推进。", "studyEnv": "课程路径清晰、学术支持稳定、规则透明的学习环境；可关注导师制度、学业辅导、课程先修要求和毕业条件。", "studyFocus": "提前拆解学期任务，按固定节奏完成阅读、作业和考试准备；遇到变化时及时调整计划。", "studyPlan": "申请准备适合采用倒排时间表，尽早整理成绩、语言和材料；选校时重点核实入学要求、课程衔接与风险预案。", "tag": "版本管理 · 稳定推进"}, "GIEF": {"desc": "你的好奇心像开了很多支线任务：这个想试，那个也有意思。你擅长发现不同领域之间的联系，但有时会因为同时开启太多方向而难以深入。", "studyEnv": "跨学科课程丰富、选修空间较大、项目类型多元的环境；可关注辅修、联合课程、社团和实践项目。", "studyFocus": "用主修方向建立稳定底盘，再把其他兴趣转化为辅修、选修或项目经历，形成有逻辑的能力组合。", "studyPlan": "申请材料不要堆砌所有兴趣，选择两三段最能体现持续投入的经历，讲清它们之间的联系。", "tag": "想法联动 · 多线探索"}, "GIBF": {"desc": "你擅长把人和事情组织起来，遇到复杂任务时会自然关注分工、资源与推进节奏。你愿意承担责任，也希望团队能朝着共同目标前进。", "studyEnv": "项目制学习、团队合作和实践机会较多的环境；可关注学生组织、案例竞赛、社团项目和跨专业协作。", "studyFocus": "在团队项目中承担协调角色，也要刻意练习专业深度，让领导力建立在可靠能力之上。", "studyPlan": "申请时呈现你如何组织团队、解决冲突并推动成果；具体说明个人贡献，避免把团队成绩全部归于自己。", "tag": "组织协调 · 资源整合"}, "GIBH": {"desc": "你愿意理解别人，也很容易注意到团队里谁需要帮助。合作时你通常比较好沟通，但有时会为了不让别人失望，把自己的时间和任务往后放。", "studyEnv": "师生沟通友好、同伴互助充分、支持服务容易获得的环境；可关注导师可及性、学生服务和合作式课程。", "studyFocus": "建立个人学习计划，合作时明确任务分工和截止时间；在支持他人的同时，也主动争取自己的学术资源。", "studyPlan": "申请材料可突出协作、服务和团队贡献；同时写出你如何管理优先级、解决问题，而不只是强调乐于助人。", "tag": "照顾同伴 · 安静补位"}, "GQEF": {"desc": "你喜欢先进入现场，靠真实体验获得信息和动力。比起长时间空想，你更愿意参加活动、认识新朋友、尝试新项目，再从经历中找到方向。", "studyEnv": "实践体验丰富、活动多元、实习与交流机会较多的环境；可关注海外实践、工作坊、交换和学生社群。", "studyFocus": "通过课堂之外的活动拓展视野，同时用固定时间完成核心课程和语言学习，避免本末倒置。", "studyPlan": "申请时用真实经历证明主动性与适应力；把活动经历与专业目标连接起来，避免只呈现旅行和社交。", "tag": "结伴行动 · 现场体验"}, "DQEH": {"desc": "你更习惯在安静、有边界的环境里思考和学习。你不一定排斥社交，只是不喜欢被迫持续互动；当拥有自主空间时，往往能投入得更深。", "studyEnv": "自主学习空间充足、图书馆与学习资源完善、课堂互动方式多元的环境；可关注小班研讨、线上支持和导师沟通渠道。", "studyFocus": "先独立预习和整理问题，再带着具体问题参加讨论或 office hours，逐步建立适合自己的互动节奏。", "studyPlan": "提前练习课堂表达、邮件沟通和小组协作；不必强迫自己变成社交达人，但要确保能主动获取必要支持。", "tag": "独处充电 · 亲自验证"}, "DQEF": {"desc": "你适应新情境的速度比较快，遇到临时变化时常能找到办法接住场面。你不一定事事按剧本走，但往往能靠观察和反应把事情推进下去。", "studyEnv": "课堂形式多元、展示与实践机会充分、能接触不同文化和任务场景的环境；可关注案例课、演讲展示和实践模块。", "studyFocus": "把临场优势与课前准备结合：提前搭框架、列关键点，课堂上再灵活发挥。", "studyPlan": "申请面试前准备核心故事和项目案例，不必逐字背稿；重点练习结构化表达与追问应对。", "tag": "即兴应答 · 看反馈调整"}, "DIBH": {"desc": "你习惯在行动前反复推演各种可能，也对自己的表现有一定要求。你能提前发现风险和细节，但有时会因为想把事情做得更好，而迟迟不愿交出第一版。", "studyEnv": "评价标准清晰、反馈及时、导师支持可获得的环境；可关注学术写作辅导、office hours 和阶段性评估机制。", "studyFocus": "用阶段交付代替一次到位：先提交初稿、获取反馈，再持续修订，避免完美主义拖慢进度。", "studyPlan": "申请时给材料设置明确的完成日期，找可信任的人做反馈；选校时了解学术支持资源和课程考核方式。", "tag": "预案推演 · 安静筹备"}, "GQBH": {"desc": "你做决定时会认真算账，关心每一份投入能带来什么。你不是单纯追求便宜，而是希望把预算、学习质量、生活体验和未来机会放在一起衡量。", "studyEnv": "费用透明、奖学金与实习信息公开、生活成本可控的环境；可比较不同城市的总预算和学校提供的支持。", "studyFocus": "建立总成本清单，纳入学费、住宿、保险、交通、材料和汇率变化；同时核对奖学金条件与续领要求。", "studyPlan": "选校时不要只比较学费，要结合课程质量、毕业要求、实习资源和个人发展目标做综合评估。", "tag": "共同生活 · 成本意识"}, "DIEF": {"desc": "你能用一点幽默看待自己的不足，也愿意承认自己还有很多不会的地方。你不需要一开始就表现完美，更在意能不能从一次次尝试中积累经验。", "studyEnv": "鼓励试错、反馈及时、支持资源充足的环境；可关注学术写作中心、语言支持、导师指导和项目实践。", "studyFocus": "采用小步快跑的学习方式：设定短周期目标，完成后复盘，再逐步提高难度。", "studyPlan": "申请时突出成长轨迹和反思能力，说明你如何从挑战中提升；不必伪装成全能选手，真实具体更有说服力。", "tag": "边试边说 · 草稿迭代"}};
const daily={"DIEH": ["遇到未知任务时，通常想先亲自探索，确认边界后再决定投入多少。", "重视彼此的自由和空间，不喜欢被过度安排。"], "DIEF": ["喜欢边尝试边调整，能从新鲜体验中获得动力。", "表达方式比较直接，愿意分享自己的进步和新发现。"], "DIBH": ["容易在行动前做多轮推演，重视计划的完整性和风险控制。", "更愿意与少数可信任的人深入交流。"], "DIBF": ["习惯先建立全局框架，再决定优先级和行动顺序。", "喜欢坦诚、高效、边界清楚的合作。"], "DQEH": ["喜欢独立探索新事物，按自己的节奏积累经验。", "需要足够的个人空间，社交更偏向少而精。"], "DQEF": ["擅长根据现场变化快速调整做法。", "在互动中比较放松，愿意用幽默化解尴尬。"], "DQBH": ["更相信稳定的计划和长期积累，不喜欢无谓冒险。", "通常通过可靠行动表达信任和在意。"], "DQBF": ["习惯先核对事实、成本和条件，再做实际决策。", "沟通直接，重视明确结论和可执行安排。"], "GIEH": ["容易被审美、文化氛围和新体验激发灵感。", "喜欢有共同兴趣、交流有质量的关系。"], "GIEF": ["兴趣广、点子多，喜欢和别人分享新发现。", "容易在讨论和创意碰撞中获得动力。"], "GIBH": ["善于感知他人需求，常主动提供支持。", "重视关系里的体谅与稳定，也需要练习表达边界。"], "GIBF": ["擅长协调不同的人和资源，让团队继续向前。", "喜欢有回应、有分工、能一起完成目标的伙伴。"], "GQEH": ["状态容易受到团队氛围影响，合适的同伴能显著提升投入度。", "喜欢有归属感的群体，但也需要自己的节奏。"], "GQEF": ["喜欢先参与、先体验，再从实践中总结规律。", "享受热闹和共同经历，也需要留意承诺与时间。"], "GQBH": ["习惯认真比较成本、条件和长期回报。", "重视稳定、务实的关系和清晰的共同安排。"], "GQBF": ["愿意为明确目标持续投入，也喜欢看到成果。", "在团队里有竞争心和带动性，重视共同达成目标。"]};
const lore={"DIEH": {"gift": "好奇心旺盛，善于发现新机会，也愿意通过亲身体验形成自己的判断。", "shadow": "容易被新鲜事吸引，频繁切换方向；需要把兴趣沉淀成持续投入和可见成果。", "quest": ["选一个最想探索的主题，连续投入四周", "每次尝试后记录一个发现和一个下一步", "为重要目标设定最低完成线，避免只开新坑"], "relationship": "重视空间和自主性，喜欢彼此尊重、不互相束缚的关系。提前沟通安排，比临时消失更能保护自由。"}, "DIEF": {"gift": "愿意承认不足、接纳反馈，并通过持续尝试获得进步；适合在实践中逐步建立信心。", "shadow": "自嘲有时会遮住真实能力，也可能让自己低估已经取得的进步。需要用具体记录看见成长。", "quest": ["每周记录三件自己学会或做得更好的小事", "把“我不行”改写成“我还需要练习哪一步”", "遇到卡点时主动向老师或同伴提一个具体问题"], "relationship": "相处轻松、愿意一起成长，不太喜欢端着或过度比较。也要记得认真表达自己的需求，不必总用玩笑带过。"}, "DIBH": {"gift": "风险预判、深度复盘、质量意识和细节敏感度较强，能提前发现潜在问题。", "shadow": "容易反复思考、迟迟不启动，也可能把一次表现看得过重。需要用阶段交付替代一次到位。", "quest": ["给当前最重要的任务设一个初稿截止时间", "每次只列出最关键的三个风险，不无限扩展清单", "主动找一位可信任的人做阶段反馈"], "relationship": "重视深度和可靠性，可能需要时间才愿意表达真实感受。把担忧说出来，往往比独自推演更有效。"}, "DIBF": {"gift": "全局判断、独立决策、资源统筹和目标拆解能力突出，适合承担复杂任务的组织与推进。", "shadow": "容易把负责变成包揽，也可能因为过度追求掌控而减少倾听。授权和协作会让计划更稳。", "quest": ["把一项任务交给伙伴负责，并明确目标而非规定每一步", "重要决定前主动听取一个不同意见", "每周检查计划时，给突发变化留出缓冲"], "relationship": "喜欢坦诚、高效和边界清楚的关系。练习表达感谢与认可，会让合作不只剩下任务分配。"}, "DQEH": {"gift": "自主学习、独立专注和深度思考能力较强，适合需要持续投入的任务。", "shadow": "过度依赖独立解决，可能错过导师反馈和同伴资源。建立低压力的支持网络会更有帮助。", "quest": ["每周主动参加一次小范围讨论或答疑", "把不确定的问题整理成三条，再向老师提问", "提前练习课堂发言或小组汇报的开场"], "relationship": "重视空间和舒适感，喜欢少而真诚的连接。明确告诉伙伴自己的沟通偏好，能减少误会。"}, "DQEF": {"gift": "临场应变、情境判断、灵活表达和快速适应能力较强。", "shadow": "过于依赖临场发挥，重要任务可能准备不足。把关键环节提前演练，会让灵活性更可靠。", "quest": ["面试或汇报前准备三个核心观点和两个案例", "每次临场发挥后复盘一个有效做法和一个可改进点", "把重要截止日期提前写入日历"], "relationship": "相处轻松、反应快，喜欢有来有往的互动。重要承诺仍要落实到行动，不能只靠临场补救。"}, "DQBH": {"gift": "稳定执行、风险意识、责任感和长期积累能力突出。", "shadow": "过度谨慎可能让机会从眼前溜走。尝试把新选择拆成低风险的小实验。", "quest": ["为一个新方向安排一次低成本体验", "每月复盘一次计划，确认哪些规则可以调整", "遇到不确定时先收集关键事实，不无限等待"], "relationship": "重视可靠和长期承诺，倾向用行动表达在意。也可以更主动说出自己的想法。"}, "DQBF": {"gift": "现实判断、信息核验、成本意识和目标落地能力较强。", "shadow": "容易只看眼前回报，低估兴趣、长期能力和不可量化的成长价值。综合比较能让决定更完整。", "quest": ["为一个目标列出成本、收益和长期能力三栏", "核实一项重要信息的官方来源", "每次比较方案时给兴趣和成长空间留出权重"], "relationship": "沟通直接，重视实际行动和清楚约定。适当表达感受，能让关系不只停留在解决问题。"}, "GIEH": {"gift": "审美判断、体验感知、创意联想和文化敏感度较强。", "shadow": "容易被包装和氛围吸引，忽略课程细节与长期投入。重要选择要把感受与事实放在一起比较。", "quest": ["深入了解一门真正感兴趣的课程，而不只看学校宣传", "把一次体验写成有观点的观察记录", "为兴趣项目设定一个可展示的成果"], "relationship": "重视共同兴趣和交流质感，不一定追求高频社交。真诚分享自己的审美与想法，会更容易遇到同频伙伴。"}, "GIEF": {"gift": "兴趣广泛、跨领域联想、快速吸收和创意表达能力突出。", "shadow": "容易同时开启太多任务，难以形成深入成果。先选主线，再把其他兴趣变成补充资源。", "quest": ["列出当前所有兴趣，只选一项作为本月主线", "完成一个小作品或阶段成果后再开新坑", "用一句话说明不同兴趣之间的共同主题"], "relationship": "喜欢一起探索新事物，也乐于分享发现。留意不要因为新鲜活动太多而忽略重要约定。"}, "GIBH": {"gift": "共情倾听、关系维护、团队支持和细节观察能力较强。", "shadow": "容易为了不让别人失望而接下过多任务。善意需要边界，自己的目标同样值得被认真对待。", "quest": ["答应帮忙前先确认自己的时间和优先级", "练习一次礼貌而明确地拒绝不合理请求", "每周为自己的学习目标预留不可挪用的时间"], "relationship": "温和、愿意理解别人，重视互相照顾。也要练习主动表达自己的需要，让关系保持双向。"}, "GIBF": {"gift": "组织协调、资源整合、沟通表达和项目推进能力较强。", "shadow": "容易把团队任务变成自己的任务，或为了效率忽略他人的节奏。明确分工和授权会让合作更持久。", "quest": ["在团队任务中明确每个人的职责和交付标准", "主动听取一位队友的不同方案", "复盘时区分团队成果与自己的具体贡献"], "relationship": "喜欢有回应、有分工、共同完成目标的关系。适当放手，给伙伴独立发挥的空间。"}, "GQEH": {"gift": "环境感知、团队适应和同伴协作能力较强，能从群体反馈中快速调整。", "shadow": "容易让外部氛围决定自己的节奏。建立个人目标和独立检查点，能减少被带偏的情况。", "quest": ["找一位学习节奏相近的伙伴结伴完成任务", "每周独立检查一次个人进度，不只看小组进度", "加入新群体前先确认自己的目标和边界"], "relationship": "喜欢有归属感的群体，也容易受伙伴影响。选择积极可靠的同伴，并保留独立判断。"}, "GQEF": {"gift": "行动意愿、体验学习、适应变化和主动参与能力较强。", "shadow": "容易把准备和复盘往后放，导致经历不少、沉淀不足。把体验转化为记录和成果，才能真正积累。", "quest": ["每次参加活动后写下一个收获和一个后续行动", "把重要截止日期提前一周设置提醒", "每学期至少完成一个能展示的项目成果"], "relationship": "喜欢热闹、坦率和共同体验。对重要约定提前确认，能让自由和可靠同时存在。"}, "GQBH": {"gift": "成本意识、信息比较、资源规划和投入产出判断能力较强。", "shadow": "容易过度关注可量化成本，忽略长期体验、关系资源和个人兴趣。综合评估能帮助你看到更完整的价值。", "quest": ["制作一份包含学费、生活费和隐性成本的预算表", "比较方案时同时列出短期成本和长期收益", "为一项真正重要的成长资源预留预算或时间"], "relationship": "重视稳定、务实和互相尊重，不喜欢无意义消耗。分享自己的考虑过程，有助于伙伴理解你的决定。"}, "GQBF": {"gift": "目标感、竞争动力、结果意识和持续推进能力较强。", "shadow": "容易把阶段结果看得过重，或为了追赶目标忽略休息与复盘。长期进步需要稳定节奏，而不是一直冲刺。", "quest": ["把一个大目标拆成三个可检查的小关卡", "每次复盘同时记录结果、方法和可改进点", "给自己安排固定休息时间，避免只追求速度"], "relationship": "喜欢积极、有目标、愿意一起进步的伙伴。合作时尊重不同节奏，不把所有事情都变成比赛。"}};
const species={"DIEH": ["全图乱飞藕", "昨天在看交互设计，今天顺着课程链接摸进了声音实验室。你查项目的路线，学校官网自己都猜不到。", "我就点开看看。——三个校区以前的我", "你最近顺藤摸瓜发现了什么冷门方向？", "探索选专业"], "DIEF": ["草稿橡皮精", "个人陈述才写了半页，你已经划掉开头重写两次，还顺手把翻车现场发给朋友。说出口以后，思路反而清楚了。", "第一版的作用，就是给第二版一个吐槽对象。", "你的文书初稿里，哪句话后来被你亲手删了？", "文书开头"], "DIBH": ["平面图蜗牛", "别人挑宿舍看照片，你先把书桌、插座、到教室的路线排演一遍。壳里装着三套备选方案，有时连出门都得等方案过审。", "我走得慢，因为我随身带了三个预案。", "选学校前，你最想提前模拟哪一天？", "选校比较"], "DIBF": ["便签登基", "小组作业刚发下来，你的桌面上已经立起三张便签：目标、分工、交稿。有人想换方向，你会先问一句“这次到底要做成什么？”", "朕的江山只有这么大，三张便签刚好管完。", "你最想把哪件申请大事拆成三步？", "申请时间线"], "DQEH": ["耳机寄居蟹", "群里正在语音轰炸，你戴上耳机，默默试完两门公开课。第二天有人问起区别，你翻出自己的试听笔记。", "麦没开，课我真听了。", "有没有一门你自己偷偷试听过的课？", "课程体验"], "DQEF": ["临场变色麦", "模拟面试突然切到陌生问题，你停一下，换个例子接着讲。结束后回听录音，才发现最顺的那段压根没写进稿子。", "稿子在第一页，我已经讲到第三个例子。", "哪道面试题让你当场换了个思路？", "面试练习"], "DQBH": ["文件夹龟", "同学找不到成绩单，你从壳里翻出中英文版，连扫描件是哪天更新的都记得。遇到陌生要求，你习惯先核对，再点提交。", "别催，我的壳里有最终版，也有真·最终版。", "你最怕漏掉哪份申请材料？", "材料清单"], "DQBF": ["实习订书鳄", "翻开一份培养方案，你先把课程、作品和岗位要求订在一起。项目名字很漂亮，你还是想看看上届学生到底做出了什么。", "这个项目能做啥？给我看个成品先。", "你看专业介绍时最想追问哪个就业问题？", "实习就业"], "GIEH": ["色卡水母", "开放日散场了，你还记得工作室窗边那张没做完的模型。回家跟朋友一聊才发现，那片颜色比招生海报更影响你的选择。", "我没记住楼名，但记住了我想坐哪张桌子。", "哪一个校园细节让你突然想去那里读书？", "校园氛围"], "GIEF": ["八爪开坑王", "群友甩来三个项目，你每个都能接一句“我有个点子”。八只手开了八个网页，现在急需一只手帮你按下保存。", "坑是真想填，手是真的只有八只。", "如果这个月只留一个坑，你会继续哪个？", "方向取舍"], "GIBH": ["便签吸水绵", "讨论结束后，你默默把大家没说完的担心贴好，整理成下一步安排。自己的那一张，倒经常被压在最底下。", "别人的待办都吸收了，我的那张呢？", "有没有一件你想请搭子反过来帮你的事？", "结伴准备"], "GIBF": ["全群一排插", "一个人有面经，一个人找搭子，一个人会做表。等大家回过神来，你已经把三个人接成了周末练习小组。", "都接上了吗？这就开工。", "给你组一个三人申请小队，还缺哪种队友？", "互助组队"], "GQEH": ["信号河豚", "进自习群你会先潜一会儿：有人守约吗，有人认真给反馈吗？频道对上了，你才慢慢收起身上的刺。", "收到靠谱信号，今天可以解除膨胀。", "搭子做过哪件小事，会让你愿意继续组队？", "自习搭子"], "GQEF": ["开学溜冰鞋", "校园活动海报刚贴出来，你已经约到人、领到票、滑到门口。回程路上，你才认真琢磨这次体验值不值得再来一次。", "先滑进去，感受一下地面。", "如果明天就能去体验一项校园活动，你选哪项？", "校园体验"], "GQBH": ["预算量勺猪", "室友说这套房便宜，你把通勤、押金和每周买菜的钱也倒进小量勺。算完给大家看一眼，群里的选项立刻少了两个。", "能不能住，等我把公交费也舀进去。", "你做留学预算时最容易漏算哪一笔？", "费用预算"], "GQBF": ["发条冲线犬", "一群人约好周五模拟面试，你把时间表贴好，自己先跑一轮计时。队友回一句“我好了”，你的发条又能多转两圈。", "有人一起跑吗？我连终点线都带来了。", "你想和搭子一起打卡完成哪个小目标？", "节点打卡"]};

function tiles(){return '<div class="tiles">'+codes.map(c=>'<button onclick="peek(\''+c+'\')"><img loading="lazy" src="'+pics[c]+'" alt=""><span>'+species[c][0]+'</span></button>').join('')+'</div>'}
function peek(c){const [n,s,q]=species[c];pop.innerHTML='<img alt="'+n+'" src="'+pics[c]+'"><small>物种手记</small><h2>'+n+'</h2><p>'+s+'</p><p class="ask">'+q+'</p><button onclick="pop.close()">合上手记</button>';pop.showModal()}
function home(){const count=ans.filter(x=>x!==null).length;app.innerHTML='<section class="hero"><div><span class="ey">新航道-前程留学 · 校园双旦活动</span><h1 class="big">校园双旦<br>礼物局</h1><p class="lead">测测你是哪位「申请季怪同学」，领角色卡，在本页报名抽礼物。</p><p class="ey">'+eventData.prizes.slice(0,3).map(p=>esc(p.name)).join(" · ")+'</p><div class="actions"><button class="primary" onclick="'+(count===44?'finish()':'quiz()')+'">'+(count===44?'打开我的报告':count?'接着答 · 已完成 '+count+' 题':'拆开我的双旦手记 →')+'</button>'+(count?'<button onclick="startOver()">重新开始</button>':'')+'</div><small>44 道题 / 约 8–12 分钟 / 16 张物种卡</small></div><div class="collage">'+['DIEH','GIBF','GIEF','DQBH'].map(c=>'<img src="'+pics[c]+'" alt="'+species[c][0]+'">').join('')+'</div></section>'+couponSection()+prizeBoard()+'<details><summary>翻看 16 张物种手记</summary>'+tiles()+'</details><details><summary>这份鉴定怎么看？</summary><p>从能量来源、理解方式、推进方式和表达习惯观察你的选择。每维有 8 道核心题、2 道补充题和 1 道情境题，分别计 1、0.5、1.5 倍权重。第三个选项计中性分。两端同分时由你选更贴近日常的一端。角色只帮助讨论偏好，没有能力排名。</p></details>';go()}
function quiz(){const ix=order[pos],q=raw[ix],n=ans.filter(x=>x!==null).length;app.innerHTML='<section class="sheet quiz"><small>观察记录　'+(pos+1)+' / 44</small><div class="measure"><i style="width:'+n/44*100+'%"></i></div><h2>'+q[0]+'</h2>'+q.slice(1,4).map((t,j)=>'<button class="opt" aria-pressed="'+(ans[ix]===j)+'" onclick="pick('+j+')"><b>'+['A','B','C'][j]+'</b>'+t+'</button>').join('')+'<div class="actions"><button onclick="prev()">'+(pos?'上一题':'回首页')+'</button><button class="primary" '+(ans[ix]===null?'disabled':'')+' onclick="next()">'+(pos===43?'查看结果':'下一题 →')+'</button></div><small>已答 '+n+' 题 · 可以返回修改</small></section>';go()}
function pick(j){ans[order[pos]]=j;poles={};save();quiz()}
function prev(){if(!pos)return home();pos--;save();quiz()}
function next(){if(ans[order[pos]]===null)return;if(pos===43)return finish();pos++;save();quiz()}
function calc(){return axes.map(([k])=>{let s=0,w=0;raw.forEach((q,i)=>{if(q[4]!==k)return;w+=wt[q[5]];s+=wt[q[5]]*[1,-1,0][ans[i]]});return 50+50*s/w})}
function tie(k,v){poles[k]=v;save();finish()}
function finish(){const empty=order.findIndex(i=>ans[i]===null);if(empty>=0){pos=empty;quiz();return}const pct=calc();let code='';for(let j=0;j<4;j++){const [k,n,l,a,r,b]=axes[j];if(pct[j]===50&&![l,r].includes(poles[k])){app.innerHTML='<section class="sheet quiz"><small>两端持平 · '+n+'</small><h2>这两种状态你都熟悉。哪一种更像平时的你？</h2><p>这次选择只用来配物种卡，报告会保留两端均衡的分数。</p>'+[[l,a],[r,b]].map(([v,t])=>'<button class="opt" onclick="tie(\''+k+'\',\''+v+'\')">'+t+'</button>').join('')+'</section>';go();return}code+=pct[j]===50?poles[k]:pct[j]>50?l:r}active=code;report(code,pct)}
function panel(h,t){return '<article><h3>'+h+'</h3><p>'+t+'</p></article>'}
function report(c,pct){const [n,scene,line,prompt,topic]=species[c],r=roles[c],l=lore[c];app.innerHTML='<div class="card"><div><small>观察手册 / SPECIMEN '+String(codes.indexOf(c)+1).padStart(2,'0')+'　'+c+'</small><h1>'+n+'</h1><span class="tag">'+r.tag+'</span><p class="quote">“'+line+'”</p><p>'+scene+'</p></div><img alt="'+n+'手绘角色" src="'+pics[c]+'"></div><div class="noprint">'+couponSection()+entryForm()+'<div class="actions"><button onclick="poster()">生成我的晒群卡</button><button onclick="share()">复制群聊发言</button><button onclick="document.querySelector(\'#full\').scrollIntoView()">读完整报告 ↓</button></div><div id="msg" role="status"></div><div id="poster"></div><p class="ask">'+prompt+'</p><p>想找人聊「'+topic+'」？把物种卡和上面的问题一起发到活动群里。</p></div><section id="full" class="divider"><small>PERSONAL FIELD NOTES</small><h2>我的留学准备报告</h2><p>'+r.desc+'</p><div class="report">'+panel('日常里的你',daily[c][0])+panel('跟搭子怎么处',daily[c][1])+panel('能帮上忙的地方',l.gift)+panel('最容易卡在哪',l.shadow)+'</div><h2>四个维度，逐项看</h2>'+axes.map(([k,n,lc,a,rc,b],i)=>{const p=pct[i],narr=narratives[k],insight=p>=55?narr.firstText:p<=45?narr.secondText:narr.balancedText;return '<div class="axis"><strong>'+n+' · '+(p>=55?a:p<=45?b:'两端接近')+'</strong><small>'+a+' '+p.toFixed(1)+'%　/　'+b+' '+(100-p).toFixed(1)+'%</small><div class="measure"><i style="width:'+p+'%"></i></div><p>'+insight+'</p></div>'}).join('')+'<h2>怎么用到申请里</h2><div class="report">'+panel('看项目时留意',r.studyEnv)+panel('适合的准备节奏',r.studyFocus)+panel('准备申请材料',r.studyPlan)+panel('协作与反馈',l.relationship)+'</div><h3 class="divider">接下来可以试的三件事</h3><ol>'+l.quest.map(x=>'<li>'+x+'</li>').join('')+'</ol></section><div class="actions"><button onclick="window.print()">打印完整报告</button><button onclick="csv()">导出本次作答 CSV</button><button onclick="home()">返回手册</button></div>';go()}
const preview={live:false,done:false,at:'2027-01-01T20:00',prizes:[{name:'无线降噪耳机',qty:1},{name:'拍立得相机',qty:2},{name:'30元饮品券',qty:10}],winners:[]};
let eventData=preview,online=false;
const esc=v=>String(v).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const dateLabel=()=>eventData.at.replace('T',' ')+'（北京时间）';
const couponEnd=Date.parse('2026-12-13T00:00:00+08:00');
const couponProducts=[['常规留学产品','2,000 元'],['高端留学产品','4,000–5,000 元']];
function couponSection(){
 if(Date.now()>=couponEnd)return '';
 return '<section class="coupon"><small>新航道-前程留学 · 12.12</small><h2>双十二留学申请优惠券</h2><p>北京时间 2026 年 12 月 12 日（含）前可用。</p><div class="coupon-grid">'+couponProducts.map(([name,amount],i)=>'<article><b>'+name+'</b><strong>减 '+amount+'</strong><button onclick="showCoupon('+i+')">领取'+(i?'高端':'常规')+'券</button></article>').join('')+'</div><p class="note">申请时向新航道-前程留学顾问出示券面。高端产品的具体优惠金额请按所选产品向顾问确认。</p></section>'
}
function couponOpen(){if(!pop.open)pop.showModal()}
let claimDevice=stored('coupon-device');
function showCoupon(i){
 const prior=stored('coupon-code-'+i);
 if(Date.now()>=couponEnd||prior){renderCoupon(i,prior);return}
 pop.innerHTML='<h2>领取'+couponProducts[i][0]+'优惠券</h2><p>优惠 '+couponProducts[i][1]+'。请留下联系方式，方便就近校区的顾问协助使用本券。</p><form id="coupon-form"><label>怎么称呼你<input name="contact" required maxlength="32" autocomplete="name" placeholder="如：小林"></label><label>大陆手机号<input name="phone" type="tel" inputmode="tel" autocomplete="tel" required pattern="1[3-9][0-9]{9}" maxlength="11"></label><label>学校<input name="school" required maxlength="80" placeholder="请填学校全称"></label><label>希望对接的城市或校区<input name="campus" required maxlength="60" placeholder="如：杭州，或“按学校就近安排”"></label><label class="cons"><input name="consent" type="checkbox" required> 我同意新航道-前程留学记录以上信息，并交由对应校区顾问联系我办理本次优惠。</label><p role="status"></p><button class="primary" type="submit">确认登记并领券</button> <button type="button" onclick="pop.close()">取消</button></form>';
 const form=pop.querySelector('form');form.onsubmit=async e=>{
 e.preventDefault();const btn=form.querySelector('[type=submit]'),msg=form.querySelector('[role=status]');btn.disabled=true;msg.textContent='正在登记…';
 try{if(!claimDevice){claimDevice=crypto.randomUUID();keep('coupon-device',claimDevice)}
 const data=Object.fromEntries(new FormData(form));Object.assign(data,{consent:form.elements.consent.checked,kind:i,device:claimDevice,source:(new URLSearchParams(location.search).get('src')||'直接访问').slice(0,60)});
 const res=await fetch('/api/coupon',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const answer=await res.json();if(!res.ok)throw Error(answer.error||'登记未完成，请重试。');
 keep('coupon-code-'+i,answer.code);if(form.isConnected&&pop.open)renderCoupon(i,answer.code);
 }catch(err){msg.textContent=err.message||'网络暂不可用，请重试。'}finally{btn.disabled=false}
 };couponOpen()
}

function renderCoupon(i,code){
 const [name,amount]=couponProducts[i];pop.innerHTML='';
 if(Date.now()>=couponEnd){pop.textContent='双十二优惠券使用期已结束。';}
 else{
 const c=document.createElement('canvas');c.width=840;c.height=730;const x=c.getContext('2d');
 x.fillStyle='#f8f3e7';x.fillRect(0,0,840,730);x.fillStyle='#195949';x.fillRect(0,0,840,105);
 function write(t,y,size,color,bold=false){x.fillStyle=color;x.font=(bold?'bold ':'')+size+'px sans-serif';x.fillText(t,44,y,750)}
 write('新航道-前程留学',68,40,'white',true);write('双十二留学申请优惠券',195,44,'#24382e',true);write(name,290,38,'#195949');write('减 '+amount,410,78,'#a4372e',true);
 write('有效至 2026 年 12 月 12 日 23:59（北京时间）',505,31,'#24382e');
 write('办理对应留学产品时，请向顾问出示本券。',582,29,'#24382e');
 if(i===1)write('具体减免金额按所选高端产品与顾问确认。',636,29,'#24382e');
 write('领券编号 '+code,692,26,'#195949');
 const image=new Image();image.alt=name+'优惠券：减 '+amount+'，12 月 12 日（含）前使用';image.className='coupon-image';image.src=c.toDataURL('image/png');pop.append(image);
 const p=document.createElement('p');p.textContent='长按图片保存，或截图留存。';pop.append(p);
 const a=document.createElement('a');a.href=image.src;a.download='双十二_'+name+'优惠券.png';a.className='btn';a.textContent='下载优惠券';pop.append(a);
 }
 const close=document.createElement('button');close.textContent='关闭';close.onclick=()=>pop.close();pop.append(close);couponOpen()
}

function prizeBoard(){return '<section class="ticket"><small>新航道-前程留学　/　双旦校园奖池</small><h2>'+(!eventData.live?'奖池预览':eventData.done?'开奖结果':'本期奖品')+'</h2>'+eventData.prizes.map(p=>'<div class="award"><b>'+esc(p.name)+'</b><span>× '+p.qty+'</span></div>').join('')+'<p>开奖时间：'+dateLabel()+'。同一手机号登记一次，最多获得一份奖品。</p>'+(eventData.done?'<details open><summary>中奖抽奖号</summary>'+ (eventData.winners.map(w=>'<p>'+esc(w.ticket)+'　'+esc(w.prize)+'</p>').join('')||'本期无有效报名。')+'</details>':'')+'</section>'}
function stored(k){try{return localStorage.getItem('winter27-'+k)}catch{return null}}
function keep(k,v){try{localStorage.setItem('winter27-'+k,v);return true}catch{return false}}
let receipt=stored('receipt');
function entryForm(){const t=stored('ticket');if(t)return '<div class="ticket"><h2>你的抽奖号</h2><strong>'+esc(t)+'</strong><p>请截图保存，开奖后与中奖名单核对。</p></div>'+prizeBoard();
const live=online&&eventData.live&&!eventData.done;return '<section class="ticket"><h2>登记我的抽奖机会</h2><p>'+(live?'填写后将在本页领取抽奖号。':eventData.done?'本期报名已结束。':'当前为预览，正式开放后可在此报名。')+'</p><form id="entry" onsubmit="enroll(event)"><fieldset '+(live?'':'disabled')+'><label>学校<input name="school" required maxlength="80" autocomplete="organization"></label><label>年级<select name="grade" required><option value="">请选择</option>'+['高中','大一','大二','大三','大四','研究生','其他'].map(v=>'<option>'+v+'</option>').join('')+'</select></label><label>大陆手机号（用于查重及领奖联系）<input name="phone" type="tel" pattern="1[3-9][0-9]{9}" required maxlength=11></label><label>想了解的专业或地区（选填）<input name="interest" maxlength="100"></label><label><input type="checkbox" name="consent" required>同意新航道-前程留学将上述信息用于本次活动登记、渠道统计及领奖联系。</label><label><input type="checkbox" name="optin">我愿意另行接收留学规划联系（选填）</label><button class="primary">登记并领取抽奖号</button></fieldset></form><p id="entrymsg" role="status"></p></section>'+prizeBoard()}
async function enroll(e){e.preventDefault();const f=e.target,b=f.querySelector('button'),out=document.querySelector('#entrymsg');if(!receipt){receipt=Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,'0')).join('');keep('receipt',receipt)}b.disabled=true;try{const v=Object.fromEntries(new FormData(f));Object.assign(v,{answers:ans,consent:f.elements.consent.checked,optin:f.elements.optin.checked,receipt,source:(new URLSearchParams(location.search).get('src')||'直接访问').slice(0,60)});let res=await fetch('/api/entry',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)}),d=await res.json();if(!res.ok)throw Error(d.error);keep('ticket',d.ticket);f.hidden=true;out.textContent='登记成功！你的抽奖号是 '+d.ticket+'，请截图保存。'}catch(err){out.textContent=err.message||'网络未连接，请重试。';b.disabled=false}}
async function initEvent(){if(location.protocol!=='file:'){try{let r=await fetch('/api/status');if(r.ok){eventData=await r.json();online=true}}catch{}}home()}

async function share(){const [n,,line,prompt]=species[active],t='我在新航道-前程留学的双旦测试里抽到的物种是「'+n+'」。'+line+'\n'+prompt;const m=document.querySelector('#msg');try{await navigator.clipboard.writeText(t);m.textContent='已复制，可以粘贴到群聊。'}catch{m.innerHTML='<label>选中下方文字即可复制<textarea readonly></textarea></label>';m.querySelector('textarea').value=t;m.querySelector('textarea').select()}}
function csv(){const rows=[['version',...raw.map((_,i)=>'q'+(i+1)),...axes.map(a=>'score_'+a[0]),'type_code'],['fieldnotes-44-v1',...ans.map(i=>'ABC'[i]),...calc().map(v=>v.toFixed(1)),active]];const u=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=u;a.download='申请季怪同学_我的作答.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}
async function poster(){const c=active,[n,,line,prompt]=species[c],host=document.querySelector('#poster'),im=new Image();im.src=pics[c];await im.decode();const cv=document.createElement('canvas');cv.width=750;cv.height=1080;const x=cv.getContext('2d');x.fillStyle='#f8f3e7';x.fillRect(0,0,750,1080);x.fillStyle='#245d49';x.fillRect(0,0,750,90);x.fillStyle='white';x.font='bold 32px sans-serif';x.fillText('新航道-前程留学  /  双旦物种手记',42,58);x.drawImage(im,146,110,458,458);x.fillStyle='#202d29';x.font='bold 66px sans-serif';x.fillText(n,42,655);function wrap(t,y,font,lh){x.font=font;let row='';for(let ch of t){if(x.measureText(row+ch).width>655){x.fillText(row,42,y);row='';y+=lh}row+=ch}x.fillText(row,42,y);return y+lh}let y=wrap('“'+line+'”',736,'34px sans-serif',48);x.fillStyle='#a34730';wrap(prompt,y+48,'bold 32px sans-serif',45);x.fillStyle='#245d49';x.font='25px sans-serif';x.fillText('校园双旦礼物局　·　'+eventData.at.slice(0,10)+' 开奖',42,1028);const url=cv.toDataURL('image/png');host.innerHTML='<p>长按图片保存，或下载后发到群里。</p><img class="poster" alt="我的群聊分享卡"><a class="btn" download="'+n+'_群聊卡.png">下载 PNG</a>';host.querySelector('img').src=url;host.querySelector('a').href=url;host.scrollIntoView({block:'start'})}
initEvent();
</script></body></html>
